version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  - taskId: {$eval: as_slugid("cache-rebind-producer")}
    schedulerId: taskcluster-github
    provisionerId: mozilla-t
    workerType: t-linux-2404-wayland
    priority: low
    created: {$fromNow: ''}
    deadline: {$fromNow: '1 hour'}
    expires: {$fromNow: '1 day'}
    scopes:
      - generic-worker:cache:mozilla-level-1-cache-rebind-20260822
    routes: [checks]
    payload:
      maxRunTime: 180
      features:
        backingLog: false
        liveLog: false
      mounts:
        - cacheName: mozilla-level-1-cache-rebind-20260822
          directory: stage/live_backing.log
      command:
        - - /bin/bash
          - -cx
          - |
            set -eu
            test -d stage/live_backing.log
            echo TC_CACHE_REBIND_PRODUCER_20260822
            curl -fsS "$TASKCLUSTER_ROOT_URL/api/queue/v1/task/$TASK_ID/status" -o producer-status.json
            {
              echo "marker=TC_CACHE_REBIND_PRODUCER_20260822"
              echo "cache_initial_type=directory"
              echo "mutation=intermediate-parent-symlink"
              echo "target=own-worker-created-backing-log"
            } > producer-proof.txt
            rm -rf stage/live_backing.log
            rmdir stage
            ln -s ../generic-worker stage
            test "$(readlink stage)" = ../generic-worker
      artifacts:
        - name: public/cache-rebind-producer-status.json
          path: producer-status.json
          type: file
          expires: {$fromNow: '1 day'}
        - name: public/cache-rebind-producer-proof.txt
          path: producer-proof.txt
          type: file
          expires: {$fromNow: '1 day'}
    metadata:
      name: FirefoxCI bounded cache-rebind producer
      description: Moves only this task's inert worker-created backing log into a controlled Level-1 cache.
      owner: bughunter0xff@users.noreply.github.com
      source: https://github.com/bughunter0xff/mozilla-version/blob/security/cache-rebind-fxci-20260822/.taskcluster.yml

  - taskId: {$eval: as_slugid("cache-rebind-consumer-1")}
    dependencies:
      - {$eval: as_slugid("cache-rebind-producer")}
    requires: all-resolved
    schedulerId: taskcluster-github
    provisionerId: mozilla-t
    workerType: t-linux-2404-wayland
    priority: low
    created: {$fromNow: ''}
    deadline: {$fromNow: '1 hour'}
    expires: {$fromNow: '1 day'}
    scopes:
      - generic-worker:cache:mozilla-level-1-cache-rebind-20260822
    routes: [checks]
    payload:
      maxRunTime: 180
      mounts:
        - cacheName: mozilla-level-1-cache-rebind-20260822
          directory: loot/captured.log
      command:
        - - /bin/bash
          - -cx
          - |
            set -eu
            curl -fsS "$TASKCLUSTER_ROOT_URL/api/queue/v1/task/$TASK_ID/status" -o consumer-status.json
            kind=missing
            matched=false
            if test -f loot/captured.log; then
              kind=file
              if grep -Fq TC_CACHE_REBIND_PRODUCER_20260822 loot/captured.log; then matched=true; fi
            elif test -d loot/captured.log; then
              kind=directory
            elif test -L loot/captured.log; then
              kind=symlink
            fi
            {
              echo "consumer=1"
              echo "cache_object_type=$kind"
              echo "producer_marker_matched=$matched"
            } > consumer-proof.txt
      artifacts:
        - name: public/cache-rebind-consumer-status.json
          path: consumer-status.json
          type: file
          expires: {$fromNow: '1 day'}
        - name: public/cache-rebind-consumer-proof.txt
          path: consumer-proof.txt
          type: file
          expires: {$fromNow: '1 day'}
    metadata:
      name: FirefoxCI bounded cache-rebind consumer 1
      description: Reads only the controlled cache object and records an exact inert marker differential.
      owner: bughunter0xff@users.noreply.github.com
      source: https://github.com/bughunter0xff/mozilla-version/blob/security/cache-rebind-fxci-20260822/.taskcluster.yml

