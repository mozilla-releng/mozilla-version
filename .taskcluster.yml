version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  - schedulerId: taskcluster-github
    provisionerId: mozilla-t
    workerType: t-linux-2404-wayland
    priority: low
    created: {$fromNow: ''}
    deadline: {$fromNow: '1 hour'}
    expires: {$fromNow: '1 day'}
    scopes: []
    routes: [checks]
    payload:
      maxRunTime: 300
      features:
        taskclusterProxy: true
      command:
        - - /bin/bash
          - -c
          - |
            set -eu
            python3 -m pip install --user --disable-pip-version-check --quiet taskcluster
            python3 - <<'PY'
            import base64
            import datetime
            import hashlib
            import json
            import os
            import urllib.error
            import urllib.parse
            import urllib.request

            import taskcluster

            task_id = os.environ['TASK_ID']
            run_id = os.environ['RUN_ID']
            root_url = os.environ['TASKCLUSTER_ROOT_URL'].rstrip('/')
            proxy_url = os.environ['TASKCLUSTER_PROXY_URL'].rstrip('/')
            expires = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=12)).isoformat()

            records = [
                ('private/canary', b'PRIVATE-DELIVERY-MARKER-7e546e3a'),
                ('public/%2e%2e/private/canary', b'PUBLIC-DECOY-MARKER-a94f51c2'),
            ]

            def queue_route(name, operation='artifacts'):
                encoded = urllib.parse.quote(name, safe='/')
                return f'/api/queue/v1/task/{task_id}/runs/{run_id}/{operation}/{encoded}'

            def json_request(url, method='GET', payload=None):
                body = None if payload is None else json.dumps(payload).encode()
                request = urllib.request.Request(url, data=body, method=method)
                if body is not None:
                    request.add_header('content-type', 'application/json')
                with urllib.request.urlopen(request) as response:
                    data = response.read()
                    return response.status, json.loads(data) if data else {}

            created = []
            for name, content in records:
                status, response = json_request(
                    proxy_url + queue_route(name),
                    'POST',
                    {
                        'storageType': 'object',
                        'expires': expires,
                        'contentType': 'text/plain',
                        'contentLength': len(content),
                    },
                )
                assert status == 200 and response['storageType'] == 'object'

                object_service = taskcluster.Object({
                    'rootUrl': root_url,
                    'credentials': response['credentials'],
                    'maxRetries': 0,
                })
                digest = hashlib.sha256(content).hexdigest()
                upload = object_service.createUpload(
                    response['name'],
                    {
                        'projectId': response['projectId'],
                        'uploadId': response['uploadId'],
                        'expires': response['expires'],
                        'hashes': {'sha256': digest},
                        'proposedUploadMethods': {
                            'dataInline': {
                                'contentType': 'text/plain',
                                'objectData': base64.b64encode(content).decode(),
                            },
                        },
                    },
                )
                assert upload['uploadMethod']['dataInline'] is True
                object_service.finishUpload(
                    response['name'],
                    {
                        'projectId': response['projectId'],
                        'uploadId': response['uploadId'],
                        'hashes': {'sha256': digest},
                    },
                )
                finish_status, _ = json_request(
                    proxy_url + queue_route(name),
                    'PUT',
                    {'uploadId': response['uploadId']},
                )
                assert finish_status == 204
                created.append({'name': name, 'objectName': response['name'], 'sha256': digest})

            controls = {}
            for label, name in [('private', records[0][0]), ('public', records[1][0])]:
                try:
                    status, response = json_request(root_url + queue_route(name, 'artifact-content'))
                    controls[label] = {'status': status, 'storageType': response.get('storageType')}
                except urllib.error.HTTPError as error:
                    controls[label] = {'status': error.code}

            assert controls['private']['status'] == 403
            assert controls['public'] == {'status': 200, 'storageType': 'object'}
            with open('delivery-result.json', 'w') as output:
                json.dump({'taskId': task_id, 'runId': run_id, 'created': created, 'controls': controls}, output, indent=2)
            PY
      artifacts:
        - name: public/delivery-result.json
          path: delivery-result.json
          type: file
          expires: {$fromNow: '1 day'}
    metadata:
      name: mozilla-version - dependency delivery
      description: Verify dependency delivery behavior.
      owner: bughunter0xff@users.noreply.github.com
      source: https://github.com/bughunter0xff/mozilla-version/blob/ci/dependency-delivery-20260823/.taskcluster.yml
