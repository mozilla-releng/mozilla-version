version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  - taskId: {$eval: as_slugid("artifact-canon-paired-markers")}
    schedulerId: taskcluster-github
    provisionerId: mozilla-t
    workerType: t-linux-2404-wayland
    priority: low
    created: {$fromNow: ''}
    deadline: {$fromNow: '1 hour'}
    expires: {$fromNow: '1 day'}
    scopes: []
    routes: [checks]
    payload:
      maxRunTime: 120
      command:
        - - /bin/bash
          - -c
          - |
            set -eu
            printf '%s\n' TC_QUEUE_CANON_PUBLIC_20260822 > public-marker.txt
            printf '%s\n' TC_QUEUE_CANON_PROTECTED_20260822 > protected-marker.txt
      artifacts:
        - name: public/canon/baseline.txt
          path: public-marker.txt
          type: file
          expires: {$fromNow: '1 day'}
        - name: protected/canon/marker.txt
          path: protected-marker.txt
          type: file
          expires: {$fromNow: '1 day'}
    metadata:
      name: FirefoxCI bounded artifact canonicalization baseline
      description: Publishes only paired inert researcher markers for an anonymous public-versus-protected artifact-path check.
      owner: bughunter0xff@users.noreply.github.com
      source: https://github.com/bughunter0xff/mozilla-version/blob/security/artifact-canon-fxci-20260822/.taskcluster.yml
