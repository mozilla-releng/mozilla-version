version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
tasks:
  - schedulerId: taskcluster-github
    provisionerId: mozilla-t
    workerType: t-linux-2404-wayland
    priority: low
    created: {$fromNow: ''}
    deadline: {$fromNow: '1 hour'}
    expires: {$fromNow: '1 day'}
    scopes:
      - generic-worker:cache:mozilla-level-1-linux-integration-20260823
    routes: [checks]
    payload:
      maxRunTime: 180
      onExitStatus:
        purgeCaches: [0]
      mounts:
        - directory: bridge
          format: tar
          content:
            url: https://raw.githubusercontent.com/bughunter0xff/mozilla-version/8cbdf9d6d1e80817e332dd8bc3938e17cdc88506/linux-integration.tar
            sha256: 8be50ccf8f20001a586ef5f2b00b2a5a3a31407cf0ed13f84e88e3c5cbd9a8d7
        - cacheName: mozilla-level-1-linux-integration-20260823
          directory: bridge/a/b/pivot/generic-worker
      command:
        - - /bin/bash
          - -c
          - |
            set -eu
            task_uid="$(id -u)"
            resolved_target="$(readlink -f bridge/a/b/pivot/generic-worker)"
            expected_target="$PWD/generic-worker"
            observed_path=generic-worker/live_backing.log
            owner_uid="$(stat -c %u "$observed_path")"
            owner_mode="$(stat -c %a "$observed_path")"
            marker_matched=false
            if grep -Fq "Task ID: $TASK_ID" "$observed_path"; then
              marker_matched=true
            fi
            curl -fsS "$TASKCLUSTER_ROOT_URL/api/queue/v1/task/$TASK_ID/status" -o task-status.json
            {
              echo "worker_pool=mozilla-t/t-linux-2404-wayland"
              echo "declared_first_directory=bridge"
              echo "declared_second_directory=bridge/a/b/pivot/generic-worker"
              echo "resolved_target_matches_expected=$([ "$resolved_target" = "$expected_target" ] && echo true || echo false)"
              echo "task_uid=$task_uid"
              echo "observed_owner_uid=$owner_uid"
              echo "observed_mode=$owner_mode"
              echo "owner_matches_task_uid=$([ "$owner_uid" = "$task_uid" ] && echo true || echo false)"
              echo "expected_marker_matched=$marker_matched"
            } > integration-result.txt
            test "$resolved_target" = "$expected_target"
            test "$owner_uid" = "$task_uid"
            test "$marker_matched" = true
      artifacts:
        - name: public/integration-result.txt
          path: integration-result.txt
          type: file
          expires: {$fromNow: '1 day'}
        - name: public/task-status.json
          path: task-status.json
          type: file
          expires: {$fromNow: '1 day'}
    metadata:
      name: mozilla-version - linux integration
      description: Run the Linux integration fixture.
      owner: bughunter0xff@users.noreply.github.com
      source: https://github.com/bughunter0xff/mozilla-version/blob/ci/linux-integration-20260823/.taskcluster.yml
